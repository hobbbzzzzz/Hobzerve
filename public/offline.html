<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Hobzerve</title>
<style>
  :root { color-scheme: light dark; --bg: #f6f8fe; --surface: #ffffff; --ink: #162036; --soft: #536079; --line: #e3e9f5; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0c1020; --surface: #141a2e; --ink: #e9edf8; --soft: #a6b0c6; --line: #29324f; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink);
         font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 360px; text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 32px 24px; }
  img { width: 56px; height: 56px; }
  h1 { font-size: 20px; margin: 16px 0 8px; }
  p { color: var(--soft); font-size: 14px; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; font-size: 14px; color: #fff; border: 0; border-radius: 14px; height: 44px; padding: 0 20px; cursor: pointer;
           background-image: linear-gradient(135deg, #1d5fe0 0%, #3b4fe0 50%, #6d3fd8 100%); }
</style>
</head>
<body>
<main>
  <img src="/pwa/icon-192.png" alt="">
  <h1>You're Offline</h1>
  <p>Hobzerve needs a connection to show live hours and tasks. Nothing is lost: reconnect and try again.</p>
  <button type="button" onclick="location.reload()">Try Again</button>
</main>
</body>
</html>
