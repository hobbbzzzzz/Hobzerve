# Minimal Supabase CLI config for `supabase link` / `supabase db push`.
# The CLI fills every unspecified setting with its defaults.
project_id = "hobzerve"

[auth]
# Decision 93: accounts are seeded; nobody signs up from the app.
# Don't also set [auth.email] enable_signup = false: the CLI reads that as "email provider off", which blocks sign-in too.
enable_signup = false
